name: CI

on:
  push:
    branches: [main, "release/**", "v1.1/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmartBank.slnx

      - name: Build
        run: dotnet build SmartBank.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SmartBank.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmartBank.slnx

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so grep its report.
      - name: Fail on known-vulnerable packages
        run: |
          dotnet list SmartBank.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found, see the report above."
            exit 1
          fi
