name: CI

# Pushes to main and release branches, and every pull request. (Topic branches are covered by their pull request; listing
# them under "push" as well would run every check twice.)
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  # Weekly run: the vulnerability audit can start failing without any commit (a new advisory), so it also runs on a timer.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Least privilege by default; no job needs more than read access to the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The guards below read the English test summary ("Passed: n", "Failed: n"); keep the runner output in English.
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # Build, unit/integration tests, and the real-database tests against PostgreSQL 16 (the production database).
  # ---------------------------------------------------------------------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # PostgreSQL is the production database. The real-database tests (concurrent transfers, the standing-order worker,
    # the production upgrade scripts) run against it. Without this variable they are skipped, as on a fresh clone.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SMARTBANK_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # System.Random is predictable. Security-relevant values must come from SecureRandom.
      # MarketRateService uses it only for demo price jitter.
      - name: Guard against System.Random in security code
        run: |
          hits=$(grep -rnE "new Random\(|Random\.Shared" src --include=*.cs | grep -v "MarketRateService.cs" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::System.Random found outside the allowed files. Use SecureRandom for secrets."
            exit 1
          fi

      - name: Restore
        run: dotnet restore SmartBank.slnx

      - name: Build
        run: dotnet build SmartBank.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: |
          set -o pipefail   # without it, `| tee` would hide a failing `dotnet test`
          dotnet test SmartBank.slnx --configuration Release --no-build \
            --collect:"XPlat Code Coverage" --results-directory ./TestResults | tee test.log

          # The real-database tests are skipped when no database is configured. A skip here would mean the
          # PostgreSQL service is not wired up, so CI treats any skipped test as a failure instead of a silent pass.
          if grep -qE "Skipped: +[1-9]" test.log; then
            echo "::error::Some tests were skipped: the PostgreSQL service did not reach the database tests."
            exit 1
          fi

      # Prints the overall line coverage in the job summary (no threshold yet; the number is for humans).
      - name: Coverage summary
        if: always()
        run: |
          file=$(ls TestResults/*/coverage.cobertura.xml 2>/dev/null | head -n 1 || true)
          if [ -z "$file" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rate=$(grep -o '<coverage [^>]*' "$file" | grep -o 'line-rate="[0-9.]*"' | head -n 1 | cut -d'"' -f2)
          branch=$(grep -o '<coverage [^>]*' "$file" | grep -o 'branch-rate="[0-9.]*"' | head -n 1 | cut -d'"' -f2)
          {
            echo "### Test coverage"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Line coverage | $(awk -v r="$rate" 'BEGIN { printf "%.1f%%", r * 100 }') |"
            echo "| Branch coverage | $(awk -v r="$branch" 'BEGIN { printf "%.1f%%", r * 100 }') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------------------------
  # The same real-database tests against SQL Server 2022. The EF migrations and local development target SQL Server,
  # so this keeps that provider honest. (The PostgreSQL-only tests are skipped here; the job above runs them.)
  # ---------------------------------------------------------------------------------------------------------------
  test-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Sm4rtBank!CiOnly#1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      SMARTBANK_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Sm4rtBank!CiOnly#1;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartBank.slnx

      - name: Build
        run: dotnet build SmartBank.slnx --configuration Release --no-restore -warnaserror

      - name: Real-database tests on SQL Server
        run: |
          set -o pipefail
          dotnet test src/SmartBank.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~SmartBank.Tests.Database" | tee test-sqlserver.log

          # A run that executed nothing (for example because the variable was not picked up, or a filter matched nothing)
          # must not count as a pass: the summary line has to say "Failed: 0" and at least one "Passed".
          if ! grep -qE "Failed: +0," test-sqlserver.log || ! grep -qE "Passed: +[1-9]" test-sqlserver.log; then
            echo "::error::The SQL Server run did not report 'Failed: 0' together with at least one passed test."
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # The EF model and the migrations must agree (no model change without a migration). Needs no database.
  # ---------------------------------------------------------------------------------------------------------------
  ef-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Throw-away values: the API validates its secrets at startup, and dotnet-ef starts the host to find the DbContext.
      JwtSettings__Key: ci-only-jwt-signing-key-0123456789abcdef
      Encryption__Key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore SmartBank.slnx

      - name: Build the API
        run: dotnet build src/SmartBank.API/SmartBank.API.csproj --configuration Release --no-restore -warnaserror

      - name: Check for pending model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/SmartBank.Infrastructure --startup-project src/SmartBank.API
          --no-build --configuration Release

  # ---------------------------------------------------------------------------------------------------------------
  # The frontend has no build step, so a syntax error would only show up in a browser. Parse every script.
  # ---------------------------------------------------------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Node.js is preinstalled on the ubuntu-latest runner image.
      - name: Syntax check (node --check)
        run: |
          status=0
          for file in src/SmartBank.Web/*.js; do
            echo "checking $file"
            node --check "$file" || status=1
          done
          exit $status

  # ---------------------------------------------------------------------------------------------------------------
  # The Dockerfile is what Render builds. Build it here so a broken image is found before a deploy (no push).
  # ---------------------------------------------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t smartbank:ci .

      # Without a database the API cannot serve requests, but it must start far enough to validate its secrets:
      # with no keys it has to fail fast and say why.
      - name: Image refuses to start without secrets
        run: |
          set +e
          output=$(docker run --rm smartbank:ci 2>&1)
          code=$?
          echo "$output" | tail -n 5
          if [ $code -eq 0 ] || ! echo "$output" | grep -q "Encryption:Key"; then
            echo "::error::Expected a fail-fast startup error about Encryption:Key."
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # The image really starts and serves: build it, start PostgreSQL, create the tables from the baseline script, run the
  # container with throw-away keys and wait for /health (liveness) and /health/ready (database) to answer 200.
  # The container uses the host network so that "localhost" is the PostgreSQL service (ubuntu runner only).
  # ---------------------------------------------------------------------------------------------------------------
  docker-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t smartbank:ci .

      # Also proves that the baseline script runs on an empty database (ON_ERROR_STOP: any error fails the step).
      - name: Create the tables from the baseline script
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD/docs/deploy:/sql:ro" postgres:16 \
            psql -h localhost -U postgres -d smartbank -v ON_ERROR_STOP=1 -f /sql/00-baseline-postgres.sql

      - name: Start the container
        run: |
          # Throw-away values, only for this job. The key is 48 characters; the AES key is base64 of 32 bytes.
          docker run -d --name smartbank --network host \
            -e JwtSettings__Key=ci-docker-run-jwt-signing-key-0123456789abcdef \
            -e Encryption__Key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
            -e "ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=smartbank;Username=postgres;Password=postgres" \
            smartbank:ci

      - name: Wait for /health and /health/ready
        run: |
          wait_for() {
            local path="$1" code="000"
            for _ in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path" || true)
              if [ "$code" = "200" ]; then echo "$path answered 200"; return 0; fi
              if [ -z "$(docker ps -q --filter name=smartbank)" ]; then echo "The container stopped."; return 1; fi
              sleep 2
            done
            echo "$path answered $code after 90 seconds"
            return 1
          }
          wait_for /health
          wait_for /health/ready
          # The security headers of the API pipeline are in place on a real response.
          curl -s -D - -o /dev/null http://localhost:8080/health | tr -d '\r' | grep -iE "^(x-content-type-options|x-frame-options|content-security-policy):"

      - name: Container log (on failure)
        if: failure()
        run: |
          docker ps -a
          docker logs smartbank 2>&1 | tail -n 200

  # ---------------------------------------------------------------------------------------------------------------
  # Fails when a NuGet package (direct or transitive) has a known vulnerability.
  # ---------------------------------------------------------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartBank.slnx

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so grep its report. The report must also
      # exist: if the vulnerability feed cannot be read, nothing is "clean", so that fails too.
      - name: Fail on known-vulnerable packages
        run: |
          set +e
          dotnet list SmartBank.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          list_status=${PIPESTATUS[0]}
          set -e
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found, see the report above."
            exit 1
          fi
          if [ "$list_status" -ne 0 ] || grep -qiE "unable to load the service index|failed to retrieve|NU1301|NU1900" vulnerable.txt; then
            echo "::error::The vulnerability report could not be produced (exit code $list_status); the feed may be unreachable."
            exit 1
          fi
          if ! grep -q "has no vulnerable packages" vulnerable.txt; then
            echo "::error::The report does not say that any project was checked."
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # One check to require in the branch protection rules instead of listing every job: it fails unless all jobs above
  # succeeded (a skipped or cancelled job counts as a failure).
  # ---------------------------------------------------------------------------------------------------------------
  all-checks:
    if: always()
    needs: [build-test, test-sqlserver, ef-model, frontend-check, docker-build, docker-run, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one job did not succeed ($result)."
              exit 1
            fi
          done
